<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<!-- http://localhost:8080/alphasys/pages/login.xhtml -->
<h:head>
    <title>AlphaSys</title>

    <style>
        body {
            background:#f0f2f5;
            font-family: "Segoe UI", sans-serif;
            margin:0;
            padding:0;
        }

        .login-container {
            width: 350px;
            margin: 8% auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        .title {
            text-align:center;
            font-size:22px;
            margin-bottom:20px;
            color:#333;
            font-weight:600;
        }
    </style>
</h:head>

<h:body>

    <div class="login-container">
        
        <h:form id="formLogin">
            
            <div class="title">AlphaSys</div>

            <p:messages id="msgs" showDetail="true" closable="true" />

            <p:inputText id="usuario" 
                         value="#{loginBean.usuario}" 
                         placeholder="Usuário"
                         style="width:100%; margin-bottom:15px;" />

            <p:password id="senha"
                        value="#{loginBean.senha}" 
                        placeholder="Senha"
                        style="width:100%; margin-bottom:20px;" />

            <p:commandButton value="Entrar"
                             action="#{loginBean.logar}"
                             update="msgs"
                             style="width:100%;"/>

        </h:form>

    </div>

</h:body>
</html>
