<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Cadastro de Usuários</title>
</h:head>

<h:body>

    <h:form id="formUsuario">

        <!-- ====== TÍTULO ====== -->
        <h2>Gerenciamento de Usuários</h2>

        <p:messages id="msgs" showDetail="true" closable="true" />

        <p:panel header="Cadastro de Usuário" style="margin-bottom:20px">

            <h:panelGrid columns="2" columnClasses="label,valor" cellpadding="5">

                <h:outputLabel value="Nome:" />
                <p:inputText value="#{usuarioBean.usuario.nome}" required="true" />

                <h:outputLabel value="Email:" />
                <p:inputText value="#{usuarioBean.usuario.email}" required="true" />

                <h:outputLabel value="Senha:" />
                <p:password value="#{usuarioBean.usuario.senha}" feedback="true" required="true" />

            </h:panelGrid>

            <p:commandButton value="Salvar"
                             icon="pi pi-check"
                             update=":formUsuario:msgs :formUsuario:tabelaUsuarios"
                             actionListener="#{usuarioBean.salvar}" />

        </p:panel>

        <!-- ====== LISTAGEM ====== -->
        <p:dataTable id="tabelaUsuarios"
                     value="#{usuarioBean.usuarios}"
                     var="u"
                     paginator="true"
                     rows="10"
                     stripedRows="true"
                     style="margin-top:20px">

            <p:column headerText="ID" width="10%">
                #{u.id}
            </p:column>

            <p:column headerText="Nome">
                #{u.nome}
            </p:column>

            <p:column headerText="Email">
                #{u.email}
            </p:column>

            <p:column headerText="Ações" width="20%">
                <p:commandButton icon="pi pi-pencil"
                                 title="Editar"
                                 update=":formUsuario"
                                 actionListener="#{usuarioBean.editar(u)}" />

                <p:spacer width="10"/>

                <p:commandButton icon="pi pi-trash"
                                 title="Excluir"
                                 update=":formUsuario:msgs :formUsuario:tabelaUsuarios"
                                 actionListener="#{usuarioBean.excluir(u)}"
                                 styleClass="ui-button-danger"
                                 onclick="return confirm('Tem certeza que deseja excluir?');" />
            </p:column>

        </p:dataTable>

    </h:form>

</h:body>
</html>
